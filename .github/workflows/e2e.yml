name: e2e

on:
  schedule:
    # Daily at 06:17 Mendoza (09:17 UTC). Off the hour on purpose: top-of-hour runs get delayed.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only scenarios whose id contains this text (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_MODELS: ${{ vars.LLM_MODELS }}
      LLM_REQUESTS_PER_MINUTE: ${{ vars.LLM_REQUESTS_PER_MINUTE }}
      LLM_TIMEOUT: "45"
      LLM_MAX_RETRIES: "1"
      BASE_URL: https://www.lu2met.ar
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run the harness against the live site
        env:
          ONLY: ${{ inputs.only }}
        run: uv run ai-test-harness "$ONLY"

      - name: Upload evidence (plans, results, traces, screenshots)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn