name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Install Chromium for the fake-site tests
        run: uv run playwright install --with-deps chromium

      - name: Harness tests (no network, no LLM)
        run: uv run pytest -v