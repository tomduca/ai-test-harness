[project]
name = "ai-test-harness"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "tomduca", email = "81401717+tomduca@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gherkin-official>=43.0.0",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.3",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-test-harness = "ai_test_harness:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real external services (LLM, website). Run with: pytest -m live"]
filterwarnings = [
    # Third-party: langsmith uses asyncio.iscoroutinefunction, deprecated in Python 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*",
]
